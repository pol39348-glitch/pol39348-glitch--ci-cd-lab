name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required page content
        run: |
          grep -q "GitHub:" index.html
          grep -q "ФИО:" index.html


      - name: Build image
        run: docker build -t ci-cd-lab:test .

      - name: Smoke test container
        run: |
          docker run -d --name site -p 8080:80 ci-cd-lab:test
          sleep 2
          curl --fail http://localhost:8080 | tee response.html
          grep -q "GitHub:" response.html
          grep -q "ФИО:" response.html
          echo "OK"

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"